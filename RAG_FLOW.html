<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gulf RAG — what actually runs</title>
<style>
  :root {
    --bg: #101311;
    --panel: #181c19;
    --line: #2a332c;
    --text: #e7eee8;
    --muted: #93a399;
    --teal: #3dbe9a;
    --teal-dim: #16382e;
    --amber: #e2b15a;
    --rose: #e07a72;
    --blue: #8eb4d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Avenir Next", "Segoe UI", sans-serif;
  }
  header {
    display: flex; justify-content: space-between; gap: 24px; align-items: flex-end;
    padding: 22px 28px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); max-width: 640px; }
  .local {
    color: var(--amber); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .scenarios { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 28px; border-bottom: 1px solid var(--line); }
  .scenarios button, .controls button {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  .scenarios button[aria-pressed="true"] { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
  .layout { display: grid; grid-template-columns: 420px 1fr; min-height: calc(100vh - 132px); }
  .rail { border-right: 1px solid var(--line); padding: 18px 18px 40px; overflow: auto; max-height: calc(100vh - 132px); }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .controls button.primary { background: var(--teal); color: #06231b; border-color: var(--teal); font-weight: 650; }
  .controls .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .step {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; cursor: pointer;
  }
  .spine { display: flex; flex-direction: column; align-items: center; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--bg); margin-top: 14px; flex: none;
  }
  .stem { width: 2px; flex: 1; background: var(--line); min-height: 18px; }
  .step.active .dot { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 0 4px rgba(61,190,154,.18); }
  .step.done .dot { background: var(--teal-dim); border-color: var(--teal); }
  .card {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 6px 0 8px;
    background: var(--panel);
  }
  .step.active .card { border-color: var(--teal); }
  .kicker { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .card h2 { font-size: 15px; margin: 2px 0 4px; font-weight: 650; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; margin-top: 6px; margin-right: 6px; font-size: 11px; padding: 2px 7px; border-radius: 999px; }
  .ext { background: #3a2a22; color: var(--amber); }
  .loc { background: #1c2a33; color: var(--blue); }
  .none { background: #242824; color: var(--muted); }
  .detail { padding: 22px 28px 64px; overflow: auto; max-height: calc(100vh - 132px); }
  .detail h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.03em; }
  .lead { color: var(--muted); margin: 0 0 18px; max-width: 68ch; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  section.block {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  }
  section.block h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); }
  .arrow { display: flex; gap: 10px; align-items: stretch; }
  .place { flex: 1; background: #101411; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
  .place b { display: block; font-size: 12px; color: var(--muted); font-weight: 550; }
  .mid { align-self: center; color: var(--teal); font-size: 20px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 4px 0; }
  code, pre { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  code { color: #d5ecdf; font-size: 12.5px; }
  pre {
    margin: 0; white-space: pre-wrap; background: #0c0f0d; border-radius: 10px;
    padding: 12px; color: #d7e6dc; font-size: 12.5px; line-height: 1.45;
  }
  .call { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .call:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .call strong { font-weight: 650; }
  a { color: var(--teal); }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .rail, .detail { max-height: none; }
    .grid { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

<header>
  <div>
    <div class="local">Walkthrough of this repo</div>
    <h1>What runs, from where, to where</h1>
    <p>Pick a scenario and press play. Each step is a real handoff in this project: the file, the function, the notes on disk, and whether anything leaves the machine.</p>

const scenarioButtons = document.getElementById("scenarios");
const rail = document.getElementById("rail");
const detail = document.getElementById("detail");
const count = document.getElementById("count");
const playButton = document.getElementById("play");
let current = "ask";
let index = 0;
let timer = null;

function kindClass(kind) {
  if (kind === "external") return "ext";
  if (kind === "local") return "loc";
  return "none";
}
function kindLabel(kind) {
  if (kind === "external") return "Leaves the machine";
  if (kind === "local") return "Stays local";
  return "No call";
}

function renderRail() {
  const steps = scenarios[current].steps;
  rail.innerHTML = steps.map((step, i) => `
    <div class="step ${i === index ? "active" : ""} ${i < index ? "done" : ""}" data-i="${i}">
      <div class="spine"><div class="dot"></div><div class="stem"></div></div>
      <div class="card">
        <div class="kicker">${step.where}</div>
        <h2>${i + 1}. ${step.title}</h2>
        <p>${step.summary}</p>
        <span class="badge ${kindClass(step.kind)}">${kindLabel(step.kind)}</span>
      </div>
    </div>
  `).join("");
  count.textContent = `${index + 1} / ${steps.length}`;
  const active = rail.querySelector(".step.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function renderDetail() {
  const scenario = scenarios[current];
  const step = scenario.steps[index];
  detail.innerHTML = `
    <div class="kicker">${scenario.label}</div>
    <h2>${step.title}</h2>
    <p class="lead">${scenario.blurb}</p>
    <section class="block">
      <h3>What is happening</h3>
      <p>${step.what}</p>
    </section>
    <section class="block">
      <h3>From where, to where</h3>
      <div class="arrow">
        <div class="place"><b>From</b>${step.from}</div>
        <div class="mid">→</div>
        <div class="place"><b>To</b>${step.to}</div>
      </div>
    </section>
    <div class="grid">
      <section class="block">
        <h3>Code</h3>
        <ul>${step.code.map(([file, fn, note]) => `<li><code>${file}</code> · <code>${fn}</code><br>${note}</li>`).join("")}</ul>
      </section>
      <section class="block">
        <h3>Docs</h3>
        <p>${step.docs}</p>
      </section>
    </div>
    <section class="block">
      <h3>Calls</h3>
      ${step.calls.map(([kind, name, note]) => `<div class="call"><strong>${kind}</strong> · ${name}<br>${note}</div>`).join("")}
    </section>
    <section class="block">
      <h3>What the data looks like here</h3>
      <pre>${step.packet.replace(/</g, "&lt;")}</pre>
    </section>
  `;
}

function show(i) {
  const steps = scenarios[current].steps;
  index = Math.max(0, Math.min(steps.length - 1, i));
  renderRail();
  renderDetail();
  if (index === steps.length - 1) stop();
}

function stop() {
  if (timer) clearInterval(timer);
  timer = null;
  playButton.textContent = "Play";
}

function play() {
  if (timer) { stop(); return; }
  if (index >= scenarios[current].steps.length - 1) show(0);
  playButton.textContent = "Pause";
  timer = setInterval(() => show(index + 1), 1600);
}

scenarioButtons.innerHTML = Object.entries(scenarios).map(([id, scenario]) =>
  `<button type="button" data-id="${id}" aria-pressed="${id === current}">${scenario.label}</button>`
).join("");

scenarioButtons.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  stop();
  current = button.dataset.id;
  for (const el of scenarioButtons.querySelectorAll("button")) {
    el.setAttribute("aria-pressed", el === button ? "true" : "false");
  }
  show(0);
});
rail.addEventListener("click", (event) => {
  const step = event.target.closest(".step");
  if (!step) return;
  stop();
  show(Number(step.dataset.i));
});
playButton.addEventListener("click", play);
document.getElementById("prev").addEventListener("click", () => { stop(); show(index - 1); });
document.getElementById("next").addEventListener("click", () => { stop(); show(index + 1); });
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") { stop(); show(index + 1); }
  if (event.key === "ArrowLeft") { stop(); show(index - 1); }
  if (event.key === " ") { event.preventDefault(); play(); }
});
show(0);
</script>
